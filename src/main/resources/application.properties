

quarkus.application.name=yayin-merkezi-backend

# --- HTTP ---
# Tum profillerde (dev/prod) ayni port. 8080 Keycloak'ta oldugu icin 8081 kullaniliyor.
quarkus.http.port=8081
# Testler ayri portta kalmali; dev mode'daki surekli test calistirma
# ile uygulamanin kendisi ayni portu paylasamaz (test-port varsayilani 8081'dir).
quarkus.http.test-port=8082

# --- Veritabani ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:app_user}
quarkus.datasource.password=${POSTGRES_PASSWORD:change_me}
quarkus.datasource.jdbc.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yayin_merkezi}

# Sema degisiklikleri Flyway ile yonetilir, Hibernate semayi degistirmez
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# --- Kimlik (Keycloak) ---
quarkus.oidc.auth-server-url=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/YayinYonetimi}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:hCXj7j8FSZjUalOCE6w7LRq55GkN53Ta}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:change_me}
quarkus.oidc.tls.verification=none

# role-claim-path BILEREK ayarlanmiyor. Rollerimiz Yayın_App client'inin client
# rolleri, yani token'da resource_access.Yayın_App.roles altinda geliyor.
# Bu ayar bos birakildiginda Quarkus Keycloak icin hem realm_access/roles hem de
# resource_access/{client_id}/roles yollarina bakiyor; acik bir yol yazmak
# client adini konfigurasyona ikinci kez gomer ve client adi degistiginde
# yetkilendirme sessizce calismaz hale gelirdi.

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:YayinYonetimi}

# Kullanici yonetimi (ekleme/silme/rol atama/sifre sifirlama) icin Admin REST API.
# Client'in service account'u acik olmali ve realm-management rollerine
# (manage-users, view-users, query-users, view-realm) sahip olmali.
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
quarkus.keycloak.admin-client.realm=${KEYCLOAK_REALM:YayinYonetimi}
quarkus.keycloak.admin-client.client-id=${KEYCLOAK_CLIENT_ID:Yayın_App}
quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_CLIENT_SECRET:change_me}
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# Kullanici kendi sifresini degistirirken mevcut sifresi bu uc uzerinden
# dogrulanir. Client'ta "Direct access grants" acik olmali.
quarkus.rest-client.keycloak-token.url=${KEYCLOAK_SERVER_URL:http://localhost:8080}

# --- Kanallar ---
# Ayni anda yayinda olabilecek kanal sayisi. Donanim/bant genisligi sinirini
# yansitir; asilirsa MediaMTX tum kanallarda birden bozulmaya baslar, bu yuzden
# sinir uygulama tarafinda uygulanip acik bir hata olarak bildiriliyor.
channels.max-active=${CHANNELS_MAX_ACTIVE:16}

# --- Klipler ---
# Ust sinir: sinirsiz birakilsa "7 gunu tek klip yap" istegi 6 Mbps'te
# ~450 GB'lik bir dosya uretmeye calisirdi.
clips.max-duration-minutes=${CLIPS_MAX_DURATION_MINUTES:120}
# Ayni anda islenecek klip sayisi. Yuksek tutulursa disk ve ag doyar,
# CANLI YAYIN etkilenir. Klip uretimi hicbir zaman yayinin onune gecmemeli.
clips.concurrency=${CLIPS_CONCURRENCY:2}
clips.poll-interval=${CLIPS_POLL_INTERVAL:5s}
clips.bucket=${CLIPS_BUCKET:klipler}
clips.download-url-ttl-minutes=${CLIPS_URL_TTL:15}

# MinIO baglantisi. "quarkus.minio.*" DEGIL: eklenti kullanilmiyor, istemci
# MinioClientProducer tarafindan uretiliyor. Eklenti kullanilsaydi Dev
# Services kendi konteynerini acip bu adresi ezerdi.
minio.url=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER:minio_admin}
minio.secret-key=${MINIO_ROOT_PASSWORD:change_me}
# Imzali indirme adresleri TARAYICIDA acilir. Backend compose aginda iken
# minio.url "http://minio:9000" olur ama tarayici o ismi cozemez; adresi
# sonradan degistirmek de imkansiz cunku S3 v4 imzasi Host basligini da
# imzaliyor. Bu yuzden imzalama ayri bir istemciyle, disaridan erisilen
# adres uzerinden yapiliyor.
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

# --- MediaMTX ---
mediamtx.api-url=${MEDIAMTX_API_URL:http://localhost:9997}
quarkus.rest-client.mediamtx.url=${MEDIAMTX_API_URL:http://localhost:9997}

# HLS adresleri backend tarafinda uretilip frontend'e hazir veriliyor.
# DIKKAT: bu adresi API'ye degil TARAYICI'ya cozulecek sekilde ayarlayin.
# Container icinden "http://mediamtx:8888" gecerlidir ama tarayici o ismi
# cozemez; disaridan erisilen adres yazilmali.
mediamtx.hls-base-url=${MEDIAMTX_HLS_BASE_URL:http://localhost:8888}

# Geri sarma (DVR) sunucusu. Disari ACILMAZ; yalnizca backend erisir,
# yetkilendirme backend'de yapilir. Compose'da 127.0.0.1'e baglidir.
quarkus.rest-client.mediamtx-playback.url=${MEDIAMTX_PLAYBACK_URL:http://localhost:9996}

# --- CORS ---
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Loglama (yapilandirilmis JSON) ---
quarkus.log.console.json=true
quarkus.log.level=INFO
quarkus.log.category."com.yayinmerkezi".level=DEBUG

# --- OpenAPI / Swagger ---
quarkus.smallrye-openapi.path=/docs/openapi.json
quarkus.swagger-ui.path=/docs
quarkus.swagger-ui.always-include=true

# Quarkus, OIDC eklentisini gorunce OpenAPI'ye otomatik "openIdConnect" semasi
# ekliyor; Swagger UI o zaman tarayici tabanli authorization-code akisi baslatip
# client_id soruyor. Bizim Keycloak client'i service account + direct grant icin
# yapilandirilmis (standard flow / redirect URI yok), dolayisiyla o akis calismaz.
# Duz bearer semasina cekiyoruz: /api/auth/login'den alinan access_token
# Authorize kutusuna yapistirilir.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.security-scheme-description=/api/auth/login yanitindaki access_token degerini yapistirin ("Bearer " onekine gerek yok).
# Token sayfa yenilendiginde kaybolmasin.
quarkus.swagger-ui.persist-authorization=true

# --- Health endpoint ---
quarkus.smallrye-health.root-path=/q/health


# ==============================
# DEV PROFILI (quarkus dev ile calisirken otomatik aktif)
# ==============================
%dev.quarkus.log.console.json=false
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.http.cors.origins=http://localhost:3000
%dev.quarkus.oidc.tls.verification=none


# ==============================
# PROD PROFILI
# ==============================
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.level=WARN
%prod.quarkus.log.category."com.yayinmerkezi".level=INFO
# Prod'da origin ZORUNLU ortam degiskeninden gelir, varsayilan (localhost) yoktur
%prod.quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS}
%prod.quarkus.oidc.tls.verification=required

