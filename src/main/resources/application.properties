

quarkus.application.name=yayin-merkezi-backend

# --- HTTP ---
# Tum profillerde (dev/prod) ayni port. 8080 Keycloak'ta oldugu icin 8081 kullaniliyor.
quarkus.http.port=8081
# Testler ayri portta kalmali; dev mode'daki surekli test calistirma
# ile uygulamanin kendisi ayni portu paylasamaz (test-port varsayilani 8081'dir).
quarkus.http.test-port=8082

# --- Veritabani ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:app_user}
quarkus.datasource.password=${POSTGRES_PASSWORD:change_me}
quarkus.datasource.jdbc.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yayin_merkezi}

# Sema degisiklikleri Flyway ile yonetilir, Hibernate semayi degistirmez
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# --- Kimlik (Keycloak) ---
quarkus.oidc.auth-server-url=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/YayinYonetimi}
quarkus.oidc.client-id=\
  ${KEYCLOAK_CLIENT_ID:hCXj7j8FSZjUalOCE6w7LRq55GkN53Ta}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:change_me}
quarkus.oidc.tls.verification=none

# role-claim-path BILEREK ayarlanmiyor. Rollerimiz Yayın_App client'inin client
# rolleri, yani token'da resource_access.Yayın_App.roles altinda geliyor.
# Bu ayar bos birakildiginda Quarkus Keycloak icin hem realm_access/roles hem de
# resource_access/{client_id}/roles yollarina bakiyor; acik bir yol yazmak
# client adini konfigurasyona ikinci kez gomer ve client adi degistiginde
# yetkilendirme sessizce calismaz hale gelirdi.

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:YayinYonetimi}

# Kullanici yonetimi (ekleme/silme/rol atama/sifre sifirlama) icin Admin REST API.
# Client'in service account'u acik olmali ve realm-management rollerine
# (manage-users, view-users, query-users, view-realm) sahip olmali.
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
quarkus.keycloak.admin-client.realm=${KEYCLOAK_REALM:YayinYonetimi}
quarkus.keycloak.admin-client.client-id=${KEYCLOAK_CLIENT_ID:Yayın_App}
quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_CLIENT_SECRET}
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# Kullanici kendi sifresini degistirirken mevcut sifresi bu uc uzerinden
# dogrulanir. Client'ta "Direct access grants" acik olmali.
quarkus.rest-client.keycloak-token.url=${KEYCLOAK_SERVER_URL:http://localhost:8080}

# --- Kanallar ---
# Ayni anda yayinda olabilecek kanal sayisi. Donanim/bant genisligi sinirini
# yansitir; asilirsa MediaMTX tum kanallarda birden bozulmaya baslar, bu yuzden
# sinir uygulama tarafinda uygulanip acik bir hata olarak bildiriliyor.
channels.max-active=${CHANNELS_MAX_ACTIVE:16}

# Cozunurluk merdiveni. Bicim: ad|GENISLIKxYUKSEKLIK|bithizi , virgulle ayrilir.
# BOS BIRAKILIRSA transcode yapilmaz ve kaynagin cozunurlugu oldugu gibi
# dagitilir (varsayilan davranis).
#
# Kaynaktan YUKSEK cozunurluk uretilemez; merdiven her zaman asagi dogrudur.
#
# Olculen maliyet (1680x750 -> 1280x720): VAAPI ile %14 CPU, tamamen yazilim
# (libx264 veryfast) ile %142. 16 kanalda fark 2,2 cekirdek ile 22,7 cekirdek
# arasinda. GPU aygiti compose'da mediamtx'e gecirilmis olmali.
channels.renditions=${CHANNELS_RENDITIONS:}

# Rendition uretiminde kullanilacak kodlayici: NVENC | VAAPI | YAZILIM
#
#   NVENC   NVIDIA (NVDEC + CUDA + NVENC). URETIM HEDEFI -- varsayilan.
#           Konteynerde NVIDIA surucusu + nvidia-container-toolkit ve GPU
#           ayrilmasi gerekiyor: docker-compose.nvidia.yml ile calistirin.
#   VAAPI   Intel/AMD, /dev/dri uzerinden. Bu gelistirme makinesinin secenegi;
#           .env'de ezilerek kullaniliyor.
#   YAZILIM libx264. Donanim yoksa; birkac kanaldan fazlasinda makineyi doyurur.
#
# ELLE seciliyor: kodlama MEDIAMTX konteynerinde yapiliyor, backend baska bir
# konteynerde oldugu icin oradaki aygitlari goremez ve otomatik secemez.
channels.encoder=${CHANNELS_ENCODER:NVENC}

# NVENC'te kareler GPU belleginde kalsin mi.
#   true  : NVDEC -> scale_cuda -> NVENC. Kareler sistem bellegine hic inmiyor,
#           en verimli yol. Her iki imajda scale_cuda ve h264_cuvid mevcut.
#   false : cozme GPU'da, olcekleme yazilimda, kodlama GPU'da. Surucu ya da
#           kaynak sorun cikarirsa buraya dusulur.
# VAAPI ve YAZILIM'da etkisi yok.
channels.gpu-full-pipeline=${CHANNELS_GPU_FULL_PIPELINE:true}

# VAAPI aygiti. Birden fazla GPU varsa renderD129, renderD130 ... olabilir.
channels.vaapi-device=${CHANNELS_VAAPI_DEVICE:/dev/dri/renderD128}

# Master playlist'ten secilecek varyantin segment basina UST SINIRI.
#
# MediaMTX master playlist verildiginde EN YUKSEK bant genisligini seciyor.
# O varyantin segmentleri gohlslib'in sinirini asarsa yayin HIC BASLAMIYOR ve
# tek belirti log'daki "max recorded size exceeded" satiri oluyor -- kullanici
# hata gormuyor, kanal sessizce olu kaliyor.
#
# Olculen: TRT 720p (3.01 MB/segment) calisiyor, TRT 1080p (4.29 MB) dusuyor.
# Sinir gohlslib icinde SABIT: hlsSegmentMaxSize 500M'ye cikarildiginda da
# ayni hata alindi, cunku o ayar HLS SUNUCUSUNU etkiliyor, kaynak okuyucusunu
# degil (denenerek dogrulandi).
#
# Belirleyici olan bant genisligi degil SEGMENT BASINA BAYT: DW'nin 6.2 Mbps
# 1080p yayini 2 saniyelik segmentlerle sorunsuz, TRT'nin 6.9 Mbps 1080p
# yayini 6 saniyelik segmentlerle dusuyor.
#
# 3.5 MB: bilinen calisan (3.01) ile bilinen dusen (4.29) arasinda, bit hizi
# dalgalanmalarina pay birakacak sekilde.
channels.hls-max-segment-bytes=${CHANNELS_HLS_MAX_SEGMENT_BYTES:3670016}

# --- Radyolar ---
# Radyolar channels.max-active sayacina DAHIL DEGIL: o sinir video kodlama ve
# bant genisligi butcesinden geliyor. Olculen maliyet bir radyo koprusu icin
# %2.6 CPU (MP3 -> AAC 128k), bir video rendition'i icin %14 -- ayni olcekte
# degiller. 32 radyo ~= 0,8 cekirdek.
radios.max-active=${RADIOS_MAX_ACTIVE:32}

# KOPRU modunda ffmpeg'in uretecegi AAC bit hizi. Radyo bazinda ezilebilir.
# Kaynagininkinin uzerine cikmak kaliteyi ARTIRMAZ, yalnizca bant genisligi
# harcar -- kanallardaki rendition dersinin aynisi.
radios.default-bitrate=${RADIOS_DEFAULT_BITRATE:128k}

# --- Videolar ---
# Ayri kova: klip TTL'i indirme icin kisa, video oynatmada ayni sure videonun
# ORTASINDA kopmaya yol aciyor. Ayri kova ileride farkli yasam dongusu
# politikasi tanimlamayi da mumkun kiliyor.
videos.bucket=${VIDEOS_BUCKET:videolar}

# Imzali PUT adresinin omru. Kisa tutuluyor: adres sizarsa pencere dar olsun.
videos.upload-url-ttl-minutes=${VIDEOS_UPLOAD_TTL:15}

# Izleme adresinin omru SAAT cinsinden ve bilincli olarak uzun. Kisa olursa
# oynatma baslar ama kullanici sure dolduktan sonra ileri sardiginda yeni bir
# range istegi 403 alir -- arayuzde bu, videonun ortasinda bozulmasi gibi
# gorunur. Adres zaten tek nesneye ve salt okumaya kapsanmis durumda.
videos.stream-url-ttl-hours=${VIDEOS_STREAM_TTL_HOURS:6}

# Tek PUT ile yuklenebilecek ust sinir. S3'un tek istek siniri 5 GB; ustu
# multipart upload gerektiriyor (parca basina imza, complete cagrisi, yarim
# yukleme temizligi) ve bu ilk surumun kapsami disinda.
videos.max-upload-bytes=${VIDEOS_MAX_UPLOAD_BYTES:5368709120}

# ERKEN SUZGEC, guvenlik siniri DEGIL: uzanti yalan soyleyebilir ve imzali
# adrese herhangi bir bayt yazilabilir. Gercek dogrulama iscide, ffprobe ile.
# Buradaki amac, 4 GB yukledikten sonra "bu format desteklenmiyor" dememek.
videos.allowed-extensions=${VIDEOS_ALLOWED_EXTENSIONS:mp4,webm,mov,m4v}

# Bu sureden eski ve hala tamamlanmamis yuklemeler supurulur. Yukleme
# suresinden UZUN olmali: 5 GB yavas baglantida uzun surer ve devam eden bir
# yuklemeyi iptal etmek en kotu sonuc olurdu.
videos.upload-timeout-minutes=${VIDEOS_UPLOAD_TIMEOUT:120}

# Video iscisi bu surecte calissin mi. Ayni jar IKI konteynerde calisiyor:
# backend (REST) ve worker (ffmpeg'li imaj). Backend imajinda ffmpeg YOK --
# orada da acik olsaydi her is "ffmpeg calistirilamadi" ile basarisiz olur ve
# kayitlar denemeler tukenene kadar HATA'ya duserdi.
videos.worker.enabled=${VIDEOS_WORKER_ENABLED:false}

# Ayni anda islenecek video sayisi. Sabit boyutlu is parcacigi havuzunun
# boyutu da bu; gercek eszamanlilik siniri havuzun kendisi.
videos.concurrency=${VIDEOS_CONCURRENCY:2}

# Redis kuyrugu. Klipten AYRI anahtar: iki is turu farkli konteynerlerde
# tuketiliyor, tek listede toplansalardi klip iscisi video isini alip geri
# koymak zorunda kalirdi.
videos.queue.key=${VIDEOS_QUEUE_KEY:video-kuyrugu}

# Supurucu iki is yapiyor: yarim kalmis YUKLEMELERI dogrulamak ve Redis'in
# kacirdigi ISLEME islerini almak. Yukleme kontrolu icin makul siklikta olmali.
videos.sweep-interval=${VIDEOS_SWEEP_INTERVAL:60s}

# ffmpeg/ffprobe icin ust sinir. Zaman asimi SART: ag uzerinden okuyan bir
# ffmpeg, kaynak yanit vermeyi birakirsa sonsuza kadar bekler ve isci is
# parcacigini kalici olarak kilitlerdi.
videos.ffmpeg-timeout-minutes=${VIDEOS_FFMPEG_TIMEOUT:30}

# Kucuk resim genisligi; yukseklik en-boy oranindan hesaplanir.
videos.thumbnail-width=${VIDEOS_THUMBNAIL_WIDTH:640}

# Kullanicinin yukledigi kucuk resim BACKEND UZERINDEN geciyor (video
# dosyasinin aksine), o yuzden sinir dar. 2 MB bir kapak gorseli icin fazlasiyla
# yeterli; ustu muhtemelen olceklenmemis bir fotograf demek.
videos.max-thumbnail-bytes=${VIDEOS_MAX_THUMBNAIL_BYTES:2097152}

# Izgarada fare kartin uzerine gelince oynayan kisa klip. Asil videoyu
# oynatmak 1080p bir kaynakta birkac saniye icin birkac MB indirmek demekti;
# bu klip ~200-400 KB. Sessiz uretiliyor -- onizleme zaten sessiz oynatiliyor.
videos.preview-seconds=${VIDEOS_PREVIEW_SECONDS:5}
# Kartlar 4 sutunlu izgarada ~300 piksel; 480 fazlasiyla yeterli.
videos.preview-width=${VIDEOS_PREVIEW_WIDTH:480}

# Kutuphane isleri (kucuk resim, onizleme klibi) hangi hizlandiriciyla:
# NVENC | VAAPI | YAZILIM
#
# channels.encoder'dan AYRI: kodlama farkli konteynerlerde yapiliyor
# (renditionlar mediamtx'te, kutuphane isleri video-worker'da) ve iki
# konteyner farkli aygitlara erisebilir.
#
# NVENC varsayilan (uretim hedefi). Kucuk resimde yalnizca COZME hizlandiriliyor
# -- JPEG'i yazan mjpeg kodlayici yazilimda, dolayisiyla kare sistem belleginde
# olmali. Asil kazanc zaten cozmede: 1080p bir dosyadan kare almak icin
# akisi cozmek gerekiyor.
videos.encoder=${VIDEOS_ENCODER:NVENC}
videos.gpu-full-pipeline=${VIDEOS_GPU_FULL_PIPELINE:true}
videos.vaapi-device=${VIDEOS_VAAPI_DEVICE:/dev/dri/renderD128}

# --- Depolama: saklama ve temizlik politikasi ---
#
# Sureler GUN ya da SAAT olarak yazilabilir:
#   P30D  -> 30 gun          720h -> ayni sure, saat cinsinden
#   PT12H -> 12 saat         0    -> KAPALI, hic silinmez
#
# VARSAYILAN OLARAK KULLANICI VERISI SILINMIYOR. Klip ve ekran goruntusu
# kullanicinin kendi arsivi; zamana bagli silmek "arsivim duruyor"
# beklentisini bozar. Baskiyi KOTA kursun, saat degil. Kurum istiyorsa acar.
storage.clip-retention=${STORAGE_CLIP_RETENTION:0}
storage.screenshot-retention=${STORAGE_SCREENSHOT_RETENTION:0}

# Basarisiz klipler VARSAYILAN OLARAK siliniyor: dosyalari zaten yok,
# yalnizca kullanici sebebini gorsun diye bekletiliyorlar.
storage.failed-clip-retention=${STORAGE_FAILED_CLIP_RETENTION:P7D}

# Supurucu araligi. Temizlik acil bir is degil; sik calistirmak bosuna
# sorgu uretir.
storage.sweep-interval=${STORAGE_SWEEP_INTERVAL:1h}

# Kullanici basina depolama kotasi. KLIP + KAYIT + EKRAN GORUNTUSU + VIDEO
# toplamini sayar. Kutuphane videolari da DAHIL: kutuphane kisisel (herkes
# kendi videosunu yukluyor ve yalnizca kendininkini goruyor), dolayisiyla
# kotadan muaf tutmanin gerekcesi kalmadi.
#
# Kota dolunca YENI IS REDDEDILIR, var olan silinmez -- sessizce silmek
# kullanicinin verisini habersiz yok etmek olurdu.
#
# 0 = sinirsiz. Varsayilan 20 GB.
storage.user-quota-bytes=${STORAGE_USER_QUOTA_BYTES:21474836480}

# --- Ekran goruntuleri ---
# Ayri kova: galerinin kendi saklama politikasi var ve karisik bir kovada
# listeleme maliyeti gereksizce artardi.
screenshots.bucket=${SCREENSHOTS_BUCKET:ekran-goruntuleri}

# Galeri izgarasinda <img src> ile gosterilen imzali adreslerin omru.
screenshots.url-ttl-hours=${SCREENSHOTS_URL_TTL_HOURS:6}

# Tek kare icin ust sinir. Kare TARAYICIDA yakalanip backend uzerinden
# geciyor; 1080p bir PNG ~2-3 MB eder, 10 MB fazlasiyla yeterli.
screenshots.max-bytes=${SCREENSHOTS_MAX_BYTES:10485760}

# --- Klipler ---
# Ust sinir: sinirsiz birakilsa "7 gunu tek klip yap" istegi 6 Mbps'te
# ~450 GB'lik bir dosya uretmeye calisirdi.
clips.max-duration-minutes=${CLIPS_MAX_DURATION_MINUTES:120}
# Ayni anda islenecek klip sayisi. Yuksek tutulursa disk ve ag doyar,
# CANLI YAYIN etkilenir. Klip uretimi hicbir zaman yayinin onune gecmemeli.
clips.concurrency=${CLIPS_CONCURRENCY:2}
# Klip iscisi bu surecte calissin mi. Ayni jar iki konteynerde calistigi icin
# gerekli: bayrak olmasaydi tuketici ve supurucu IKISINDE BIRDEN acilir,
# SKIP LOCKED veri bozulmasini engellese de iki kat bosa is uretirdi.
clips.worker.enabled=${CLIPS_WORKER_ENABLED:true}
# Redis kuyrugu. Redis DOGRULUK KAYNAGI DEGIL, bildirim kanali: is kalici
# olarak clips tablosunda durur, Redis yalnizca "yeni is var" haberini tasir.
# Redis tamamen coksa bile is kaybolmaz, gecikme supurucu araligina duser.
clips.queue.key=${CLIPS_QUEUE_KEY:klip-kuyrugu}
# Supurucu yalnizca ariza durumlari icin: Redis bildirimi kaybolmussa veya
# is Redis ayaktayken olusturulmadiysa bekleyen satirlari bulur. Normal yolda
# isler Redis'ten aninda geldigi icin aralik uzun tutuldu.
clips.sweep-interval=${CLIPS_SWEEP_INTERVAL:60s}
# Redis baglantisi ACIKCA yaziliyor. Yazilmazsa Dev Services kendi Redis
# konteynerini rastgele bir portta acar ve compose'daki Redis'i yok sayar;
# klip bildirimleri her yeniden baslatmada kaybolan gecici bir ornege gider.
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.devservices.enabled=false

clips.bucket=${CLIPS_BUCKET:klipler}
clips.download-url-ttl-minutes=${CLIPS_URL_TTL:15}

# MinIO baglantisi. "quarkus.minio.*" DEGIL: eklenti kullanilmiyor, istemci
# MinioClientProducer tarafindan uretiliyor. Eklenti kullanilsaydi Dev
# Services kendi konteynerini acip bu adresi ezerdi.
minio.url=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER:minio_admin}
minio.secret-key=${MINIO_ROOT_PASSWORD:change_me}
# Imzali indirme adresleri TARAYICIDA acilir. Backend compose aginda iken
# minio.url "http://minio:9000" olur ama tarayici o ismi cozemez; adresi
# sonradan degistirmek de imkansiz cunku S3 v4 imzasi Host basligini da
# imzaliyor. Bu yuzden imzalama ayri bir istemciyle, disaridan erisilen
# adres uzerinden yapiliyor.
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

# --- MediaMTX ---
mediamtx.api-url=${MEDIAMTX_API_URL:http://localhost:9997}
quarkus.rest-client.mediamtx.url=${MEDIAMTX_API_URL:http://localhost:9997}

# HLS adresleri backend tarafinda uretilip frontend'e hazir veriliyor.
# DIKKAT: bu adresi API'ye degil TARAYICI'ya cozulecek sekilde ayarlayin.
# Container icinden "http://mediamtx:8888" gecerlidir ama tarayici o ismi
# cozemez; disaridan erisilen adres yazilmali.
mediamtx.hls-base-url=${MEDIAMTX_HLS_BASE_URL:http://localhost:8888}

# Geri sarma (DVR) sunucusu. Disari ACILMAZ; yalnizca backend erisir,
# yetkilendirme backend'de yapilir. Compose'da 127.0.0.1'e baglidir.
quarkus.rest-client.mediamtx-playback.url=${MEDIAMTX_PLAYBACK_URL:http://localhost:9996}

# --- CORS ---
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Loglama (yapilandirilmis JSON) ---
quarkus.log.console.json=true
quarkus.log.level=INFO
quarkus.log.category."com.yayinmerkezi".level=DEBUG

# --- OpenAPI / Swagger ---
quarkus.smallrye-openapi.path=/docs/openapi.json
quarkus.swagger-ui.path=/docs
quarkus.swagger-ui.always-include=true

# Quarkus, OIDC eklentisini gorunce OpenAPI'ye otomatik "openIdConnect" semasi
# ekliyor; Swagger UI o zaman tarayici tabanli authorization-code akisi baslatip
# client_id soruyor. Bizim Keycloak client'i service account + direct grant icin
# yapilandirilmis (standard flow / redirect URI yok), dolayisiyla o akis calismaz.
# Duz bearer semasina cekiyoruz: /api/auth/login'den alinan access_token
# Authorize kutusuna yapistirilir.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.security-scheme-description=/api/auth/login yanitindaki access_token degerini yapistirin ("Bearer " onekine gerek yok).
# Token sayfa yenilendiginde kaybolmasin.
quarkus.swagger-ui.persist-authorization=true

# --- Health endpoint ---
quarkus.smallrye-health.root-path=/q/health


# ==============================
# DEV PROFILI (quarkus dev ile calisirken otomatik aktif)
# ==============================
%dev.quarkus.log.console.json=false
%dev.quarkus.hibernate-orm.log.sql=true
# Sabit deger DEGIL: burasi "http://localhost:3000" olarak yaziliyken
# CORS_ALLOWED_ORIGINS ortam degiskeni sessizce yok sayiliyordu -- profil
# ayari temel ayari ezdigi icin. Konteyner dev profiliyle calistigindan
# .env'deki deger hicbir zaman devreye girmiyordu.
%dev.quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
%dev.quarkus.oidc.tls.verification=none


# ==============================
# PROD PROFILI
# ==============================
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.level=WARN
%prod.quarkus.log.category."com.yayinmerkezi".level=INFO
# Prod'da origin ZORUNLU ortam degiskeninden gelir, varsayilan (localhost) yoktur
%prod.quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS}
%prod.quarkus.oidc.tls.verification=required

