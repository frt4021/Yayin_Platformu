# Yayın Merkezi — altyazı kuyruğu metrikleri.
#
# Backend ve video-worker AYNI jar, ama VadService (ve onun kuyruk
# metrikleri) yalnızca video-worker'da gerçek değer üretiyor -- VAD_ENABLED
# backend'de kapalı. Backend de tarandığı için diğer standart JVM/HTTP
# metrikleri de görünür oluyor, kazancı buradan.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: backend
    metrics_path: /q/metrics
    static_configs:
      - targets: ["backend:8081"]

  - job_name: video-worker
    metrics_path: /q/metrics
    static_configs:
      - targets: ["video-worker:8082"]

  - job_name: dcgm-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  # Triton'un kendi urettigi nv_inference_*/nv_cache_*/nv_gpu_memory_*
  # metrikleri -- container'in ic portu (8002), disari acilan PORT_TRITON_METRICS
  # host port'u degil (docker network'te servisler birbirine container adi +
  # ic port ile konusuyor). stt-worker'in eski job'unun (stt_batch_boyutu vb.)
  # yerini aldi -- stt-worker artik calismiyor.
  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets: ["triton:8002"]

  # MediaMTX'in kendi native metrik dinleyicisi (mediamtx.yml: metrics/metricsAddress).
  - job_name: mediamtx
    metrics_path: /metrics
    static_configs:
      - targets: ["mediamtx:9998"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: keycloak-postgres
    static_configs:
      - targets: ["keycloak-postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # MINIO_PROMETHEUS_AUTH_TYPE=public ile kimlik dogrulamasiz acildi.
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  # KC_METRICS_ENABLED=true ile acildi. PORT DOGRULANMADI: Keycloak 25'te
  # metrikler ayri bir yonetim arayuzunde (varsayilan 9000) olabilir --
  # container ayaga kalkinca `docker compose exec keycloak env | grep KC_HTTP`
  # ve `curl` ile gercek port/yol dogrulanip gerekirse burasi duzeltilmeli.
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
