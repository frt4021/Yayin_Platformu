networks:
  yayin-merkezi:
    driver: bridge

volumes:
  postgres_data:
  keycloak_postgres_data:
  minio_data:
  mediamtx_recordings:

services:

  # --- Veritabanı (uygulama verisi) ---
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yayin_merkezi
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host'ta 5432'yi makinede kurulu PostgreSQL 14 servisi tutuyor;
      # container disariya 5433'ten acilir. Compose agi icinde adres yine postgres:5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yayin-merkezi

  # --- Keycloak için ayrı veritabanı ---
  keycloak-postgres:
    image: postgres:16
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change_me}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - yayin-merkezi

  # --- Kimlik yönetimi ---
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    restart: unless-stopped
    # --import-realm: keycloak/realm-export.json'daki realm ilk acilista
    # kurulur. Realm ZATEN VARSA dosya yok sayilir — yani bu dosyayi
    # degistirmek mevcut bir Keycloak'i guncellemez, yalnizca sifir
    # ortamlarda etkilidir.
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change_me}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change_me}
      # realm-export.json icindeki $(env:...) yer tutucularini Keycloak
      # bu degiskenlerden doldurur. Secret dosyaya yazilmaz.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change_me}
      KEYCLOAK_BOOTSTRAP_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD:-change_me}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-postgres
    networks:
      - yayin-merkezi

  # --- Nesne depolama (video, kayıt, klip dosyaları) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web konsolu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - yayin-merkezi

  # --- Job queue / cache ---
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - yayin-merkezi

  # --- Medya sunucusu (canlı yayın alma, HLS üretimi, DVR kaydı) ---
  mediamtx:
    # Ozel imaj: resmi imaj scratch tabanli, icinde ffmpeg yok. Cozunurluk
    # dusurme (transcode) runOnAvailable kancasiyla KONTEYNER ICINDE
    # calistigi icin ffmpeg oraya girmek zorunda. Imaj ayrica kendi VAAPI
    # surucusunu (iHD) tasiyor: host'taki surucu yalnizca CQP destekliyordu,
    # imajdaki CBR aciyor ve bit hizi hedeflenebiliyor.
    build:
      context: .
      dockerfile: Dockerfile.mediamtx
    image: yayin/mediamtx:1.19.3
    container_name: mediamtx
    restart: unless-stopped
    # Donanim kodlayici. Hangi GPU'nun kullanilacagi .env ile belirleniyor;
    # ayri bir compose dosyasi yok (bkz. README "Donanim kodlayici").
    #
    #   Intel/AMD (VAAPI) : MEDIA_DEVICE=/dev/dri:/dev/dri   (varsayilan)
    #   NVIDIA (NVENC)    : CONTAINER_RUNTIME=nvidia
    #                       NVIDIA_VISIBLE_DEVICES=all
    #                       NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
    #                       MEDIA_DEVICE=/dev/null:/dev/null
    #
    # MEDIA_DEVICE neden gerekli: NVIDIA sunucularinda /dev/dri bulunmayabilir
    # ve sabit yazilirsa konteyner hic baslamaz. /dev/null zararsiz bir yer
    # tutucu.
    runtime: ${CONTAINER_RUNTIME:-runc}
    devices:
      - ${MEDIA_DEVICE:-/dev/dri:/dev/dri}
    environment:
      # NVIDIA kullanilmiyorsa bos kalir ve hicbir etkisi olmaz.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
      # Adlandirilmis volume yerine host dizinleri: uretilen manifest,
      # segment ve kayit dosyalari dosya yoneticisinden dogrudan gorulebilsin.
      - ./mediamtx-data/hls:/hls
      # DVR kayitlari. Uretimde buyuk diski DVR_PATH ile gosterin:
      #   DVR_PATH=/mnt/dvr docker compose up -d
      # 16 kanal x 7 gun x 6 Mbps ~= 7.3 TB; %20 payla 8.7 TB disk gerekir.
      - ${DVR_PATH:-./mediamtx-data/recordings}:/recordings
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS/HTTP
      - "9997:9997"   # REST API (dinamik path yönetimi)
      # Geri sarma sunucusu. Yalnizca 127.0.0.1'e baglanir: gelistirmede
      # host'taki backend erisebilsin diye acik, ama agdan erisilemez.
      # Uretimde backend compose aginda oldugu icin bu satir kaldirilabilir.
      - "127.0.0.1:9996:9996"
    networks:
      - yayin-merkezi

  backend:
    build:
      # Quarkus kaynaklari proje kokunde; Dockerfile compose dosyasinin yaninda.
      context: ../../..
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: backend
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yayin_merkezi

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-Yayın_App}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change_me}

      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_PLAYBACK_URL: http://mediamtx:9996
      # TARAYICI'nin cozecegi adres. "mediamtx" ismi ag ici; disaridan
      # erisilen adres yazilmali yoksa oynatici yayini bulamaz.
      MEDIAMTX_HLS_BASE_URL: ${MEDIAMTX_HLS_BASE_URL:-http://localhost:8888}

      # Rendition kodlayicisi: VAAPI | NVENC | YAZILIM
      # Komutu backend uretiyor ama KODLAMA mediamtx konteynerinde calisiyor;
      # bu yuzden deger oradaki donanima gore secilmeli.
      CHANNELS_ENCODER: ${CHANNELS_ENCODER:-VAAPI}

      MINIO_ENDPOINT: http://minio:9000
      # Imzali indirme adresleri tarayicida acilir; S3 imzasi Host basligini
      # de kapsadigi icin adresi sonradan degistirmek imkansiz.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}

      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Video isleri ayri konteynerde (ffmpeg burada yok). Klipler burada
      # kaliyor: onlarin isi MediaMTX'ten akis cekmek, ffmpeg gerektirmiyor.
      VIDEOS_WORKER_ENABLED: "false"
      CLIPS_WORKER_ENABLED: "true"
    depends_on:
      - postgres
      - keycloak
      - minio
      - redis
      - mediamtx
    ports:
      - "8090:8081"
    networks:
      - yayin-merkezi

  # --- Video isleme iscisi ---
  # Backend ile AYNI jar, ustune ffmpeg eklenmis imaj. Ayri olmasinin sebebi
  # ffmpeg'in backend imajini ~300 MB buyutmesi ve REST surecinin onu hic
  # kullanmamasi. Sorumluluk ayrimi ortam degiskenleriyle yapiliyor.
  video-worker:
    build:
      context: ../../..
      dockerfile: src/main/docker/Dockerfile.worker
    image: yayin/video-worker:latest
    container_name: video-worker
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yayin_merkezi

      # Isci REST sunmuyor ama OIDC yapilandirmasi acilis icin gerekli.
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-Yayın_App}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change_me}

      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_PLAYBACK_URL: http://mediamtx:9996

      MINIO_ENDPOINT: http://minio:9000
      # Isci ffmpeg'e IC agdaki imzali adresi veriyor (VideoStorage
      # .internalReadUrl), yani MINIO_ENDPOINT uzerinden. Buradaki public-url
      # yalnizca bean uretimi icin gerekli; isci disariya adres sunmuyor.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}

      REDIS_URL: redis://redis:6379

      # Sorumluluk ayrimi: video isleri BURADA, klipler backend'de.
      VIDEOS_WORKER_ENABLED: "true"
      CLIPS_WORKER_ENABLED: "false"
      VIDEOS_CONCURRENCY: ${VIDEOS_CONCURRENCY:-2}

      # Onizleme klibi kodlayicisi: YAZILIM | VAAPI | NVENC
      # Varsayilan YAZILIM -- 5 saniyelik 480p klip zaten saniyeler icinde
      # kodlaniyor ve aygit gecirilmesini gerektirmiyor.
      #
      # Donanim secimi .env ile (bkz. README "Donanim kodlayici").
      VIDEOS_ENCODER: ${VIDEOS_ENCODER:-YAZILIM}

      # NVIDIA kullanilmiyorsa bos kalir ve hicbir etkisi olmaz.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-}

      # Flyway backend'de calisiyor; iki surecin ayni semayi migrate etmeye
      # calismasi yaris durumu yaratirdi.
      QUARKUS_FLYWAY_MIGRATE_AT_START: "false"
    runtime: ${CONTAINER_RUNTIME:-runc}
    # Varsayilan /dev/null: worker'a aygit gerekmiyor (YAZILIM kodlama).
    # VAAPI icin WORKER_MEDIA_DEVICE=/dev/dri:/dev/dri verin.
    devices:
      - ${WORKER_MEDIA_DEVICE:-/dev/null:/dev/null}
    depends_on:
      - postgres
      - minio
      - redis
    networks:
      - yayin-merkezi

  frontend:
    build:
      context: ../../../frontend/yayin-frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - yayin-merkezi