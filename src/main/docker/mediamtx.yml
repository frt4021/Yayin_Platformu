
# MediaMTX yapılandırması.
#
# Kanallar bu dosyaya elle yazılmaz: backend, REST API üzerinden
# (http://mediamtx:9997/v3/config/paths/...) path ekler/siler. paths
# bölümünün boş olması normaldir — kalıcı kayıt PostgreSQL'deki channels
# tablosudur, uygulama açılışta oradan okuyup path'leri yeniden kurar.

###############################################
# API
###############################################

api: yes
apiAddress: :9997

###############################################
# HLS
###############################################

hls: yes
hlsAddress: :8888

# Varsayilan olarak segmentler yalnizca BELLEKTE tutulur ve diske hic
# yazilmaz. Buraya bir dizin verildiginde MediaMTX playlist ve segment
# dosyalarini gercekten yazar; ne uretildigi disaridan incelenebilir.
# Bedeli: her segment icin disk yazmasi. Uretimde bellek daha hizlidir.
hlsDirectory: /hls

# İzleme sayfası backend ile aynı origin'de (:8081), HLS ise :8888'de duruyor.
# Tarayıcı bunları farklı origin sayar; bu başlık olmadan <video> etiketi
# manifest'i CORS hatasıyla reddeder.
hlsAllowOrigins: ['*']

# Bir HLS oturumu (readers listesindeki her giris) son istekten sonra bu
# sure boyunca acik tutuluyor -- kisa bir kesintide izleyici sifirdan
# arabellek doldurmasin diye. Varsayilan 60s: kanal/radyo "kac kisi izliyor"
# sayaci (ChannelService/RadioService toDto -> readers().size()) bu yuzden
# gercek ayrilmadan dakikaya yakin yuksek gorunuyordu.
#
# OLCULDU: master playlist'e her yeni istek (her "src degisti" -> hls.js
# yeniden baglanma) MediaMTX'te ayri bir hlsSession aciyor; eskisi hemen
# kapanmiyor, varsayilan 60s'lik bu sure gecene kadar readers'ta kaliyor.
# Bes kez ac/kapa dongusunde reader sayisi 5'e kadar cikti, hicbir istek
# olmadan ~70s sonra kendiliginden 0'a dustu (kod degisikligi olmadan).
#
# 10s'e dusuruldu: sayac gerceğe çok daha yakin takip eder. Cok kisa
# tutulmamali -- bir izleyici bu sureden uzun donarsa (agir buffering)
# oturumu MediaMTX kapatir ve bir sonraki istek sifirdan yeni oturum acar.
hlsMuxerCloseAfter: 10s

###############################################
# Kimlik doğrulama
###############################################

# MediaMTX varsayılanı yönetim API'sini yalnızca 127.0.0.1'e açıyor. Backend
# ayrı bir container'dan (geliştirmede host'tan) bağlandığı için istek bridge
# ağının IP'siyle geliyor ve varsayılan ayarla "authentication error" alıyor.
authInternalUsers:

  # Yayın alma ve izleme herkese açık.
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read

  # Yönetim API'si yalnızca localhost ve Docker bridge ağlarından.
  #
  # PROD NOTU: bu ağa erişebilen her şey kanal ekleyip silebilir. Üretimde ips
  # kısıtı yerine gerçek bir user/pass tanımlanmalı ve backend'e ortam
  # değişkeni olarak verilmeli.
  - user: any
    pass:
    ips: ['127.0.0.1', '::1', '172.16.0.0/12']
    permissions:
      - action: api
      - action: metrics
      - action: pprof

###############################################
# Kayit (DVR) ve geri sarma
###############################################

# Playback sunucusu KAPALI.
#
# Eskiden zaman cizelgesi ve klip cikarma bunun uzerinden calisiyordu. DVR
# kaydi MediaMTX'ten alininca (ffmpeg RTSP'den cekip MinIO'ya akitiyor --
# org.example.dvr.DvrRecorder) bu sunucunun okuyacagi dizin kalmadi; acik
# birakilsaydi bos bir dizini dinleyen olu bir port olurdu.
playback: no

# Tum path'ler icin varsayilan.
#
# KAYIT ARTIK BURADA DEGIL. MediaMTX yalnizca yerel dosya sistemine
# yazabiliyor (S3 destegi yok) ve bu, kayitlari host diskine bagliyordu.
# Kayit RTSP'den ffmpeg ile cekilip MinIO'ya akitiliyor; saklama suresini de
# MinIO'nun yasam dongusu kurali uyguluyor (DVR_RETENTION_DAYS).
#
# record acik birakilsaydi ayni icerik hem diske hem MinIO'ya yazilir, disk
# yeniden dolardi.
pathDefaults:
  record: no

###############################################
# Path'ler
###############################################

# Boş — bkz. dosyanın başındaki not. Her path backend tarafından API ile eklenir.
paths: {}
