# HLS cache -- 100 kullanicilik olceklemede origin'e (MediaMTX) giden yuku
# azaltmak icin (docs/olcekleme-100-kullanici-plani.md, S2.1). Bu satir
# server{} disinda ama conf.d dosyasi http{} baglamina dahil oldugu icin
# (bkz. Dockerfile: /etc/nginx/conf.d/default.conf) burada durmasi gecerli.
proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:64m
                 max_size=2g inactive=60s use_temp_path=off;

server {
    listen 80;

    # Alan adı IDN olduğu için PUNYCODE yazılmalı: tarayıcı "yayın.com"u
    # ağa çıkarken "xn--yayn-nza.com"a çevirir ve nginx'e gelen Host başlığı
    # o hâlde olur. Unicode yazılsaydı hiçbir istek eşleşmezdi.
    #
    # "_" hepsini yakalayan varsayılan: IP ya da localhost ile erişim de
    # çalışmaya devam etsin.
    server_name xn--yayn-nza.com www.xn--yayn-nza.com localhost _;

    root /usr/share/nginx/html;

    # Yayın segmentleri büyük olabiliyor; varsayılan 1 MB sınırı yükleme
    # uçlarında da dar kalıyor.
    client_max_body_size 64m;

    # Tek sayfa uygulaması: /klipler gibi bir adres doğrudan açıldığında
    # diskte o isimde dosya yok. index.html'e düşülmezse 404 alınır ve
    # yalnızca ana sayfadan gezinmek mümkün olur.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API istekleri backend'e. Geliştirmede aynı işi Vite proxy'si yapıyor;
    # her ikisinde de tarayıcı tek origin gördüğü için CORS devreye girmez.
    location /api/ {
        proxy_pass http://backend:8081;
        # $http_host, $host'un aksine PORTU KORUYOR. Ayrintili gerekce
        # asagida /hls/ blogunda.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Geriye sarma akışı uzun sürebilir; varsayılan 60 sn yetmez.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # WebSocket — canlı altyazı akışı.
    #
    # Upgrade ve Connection başlıkları AÇIKÇA iletilmeli: nginx varsayılan
    # olarak hop-by-hop başlıkları düşürüyor ve el sıkışma sessizce
    # HTTP'ye düşüyor. Belirtisi "bağlantı kuruluyor ama mesaj gelmiyor".
    location /ws/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;

        # Canlı altyazıda mesajlar arası dakikalar geçebilir (sessizlik);
        # varsayılan 60 sn boşta kalma bağlantıyı koparırdı.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HLS yayını. Tek origin olması iki şey kazandırıyor:
    #   * CORS gerekmiyor,
    #   * izleyicinin ayrıca 8888 portuna erişebilmesi gerekmiyor.
    #
    # İKİ AYAR BİRLİKTE ÇALIŞMAK ZORUNDA — ikisi de ölçülerek bulundu:
    #
    #   proxy_pass .../   (sondaki slash)  "/hls" önekini KIRPAR.
    #       Şart: MediaMTX path adını yolun tamamından çıkarıyor ve önek
    #       korunursa "path 'hls/kanal1' is not configured" hatası veriyor.
    #
    #   proxy_redirect                     Location başlığına öneki GERİ EKLER.
    #       Şart: MediaMTX oturum çerezi için 302 ile kendine yönlendiriyor
    #       (?cookieCheck=1) ve Location'ı kendi gördüğü yola göre üretiyor
    #       -- yani "/kanal1/...". Düzeltilmezse tarayıcı /hls olmayan bir
    #       adrese gidiyor, nginx SPA kuralına düşüp index.html dönüyor ve
    #       hls.js playlist yerine HTML alıyor. Belirtisi: "yayında ama
    #       bağlanmıyor".
    # Playlist (.m3u8): saniyeler icinde degisiyor, cache kisa (2sn) --
    # canli kenardan cok geride kalmayi onluyor. Segment'ten (asagida) AYRI
    # location: ikisinin cache omru cok farkli, tek yerde tutulamaz.
    #
    # $rest capture group + acik $rest referansi: proxy_pass'ta degisken
    # kullanimi regex location'da HER ZAMAN gecerli (nginx'in yasakladigi
    # yalnizca ORTUK prefix-kirpma, yani degiskensiz "proxy_pass .../").
    # Alttaki $http_host/proxy_redirect mantigi asagidaki /hls/ blogundan
    # BIREBIR kopyalandi -- degistirilmedi.
    #
    # $is_args$args SART: proxy_pass'a URI parcasi ($rest) eklenince nginx
    # orijinal sorgu dizesini ARTIK OTOMATIK TASIMIYOR (eski /hls/ blogunda
    # "proxy_pass .../;" URI'siz oldugu icin sorgu dizesi kendiliginden
    # tasiniyordu). Bu satir olmadan MediaMTX'in "?cookieCheck=1" oturum
    # cerezi dogrulamasi HICBIR ZAMAN upstream'e ulasmiyor -- MediaMTX her
    # istekte "cerez dogrulanmadi" sanip yeniden yonlendiriyor, SONSUZ
    # DONGU (canli yayin/radyo hic akmiyor). OLCULDU: bu satir eklenmeden
    # curl ile cerezli istekte bile surekli 302 donuyordu.
    location ~ ^/hls/(?<rest>.+\.m3u8)$ {
        proxy_pass http://mediamtx:8888/$rest$is_args$args;
        proxy_set_header Host $http_host;
        proxy_redirect ~^https?://[^/]+/(.*)$ $scheme://$http_host/hls/$1;
        proxy_redirect ~^/(.*)$ $scheme://$http_host/hls/$1;

        proxy_cache hls_cache;
        proxy_cache_valid 200 2s;
        # proxy_cache_lock SART: yeni segment uretilince onlarca istemci
        # ayni ~100ms'lik pencerede gelir. Bu olmadan hepsi cache miss alip
        # AYNI ANDA MediaMTX'e gider (thundering herd) -- cache'in onlemeye
        # calistigi yuku cache'in kendisi uretir. Bu ayar, ayni anahtar icin
        # TEK upstream istegi yapar, diger istekler o istek donene kadar bekler.
        proxy_cache_lock on;
        add_header Cache-Control "no-cache" always;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Segment (.ts/.m4s): dosya adi tekil, yazildiktan sonra ASLA degismez
    # -- uzun/sonsuz cache guvenli.
    location ~ ^/hls/(?<rest>.+\.(ts|m4s))$ {
        proxy_pass http://mediamtx:8888/$rest$is_args$args;
        proxy_set_header Host $http_host;
        proxy_redirect ~^https?://[^/]+/(.*)$ $scheme://$http_host/hls/$1;
        proxy_redirect ~^/(.*)$ $scheme://$http_host/hls/$1;

        proxy_cache hls_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Yukaridaki iki regex'e uymayan her sey icin (MediaMTX'in kendi
    # cerez-kontrol yonlendirmesi gibi) -- degismedi, hala cache'siz.
    location /hls/ {
        proxy_pass http://mediamtx:8888/;

        # $host DEGIL $http_host: ikisi arasindaki fark PORT.
        #
        # $host portu ATIYOR. MediaMTX oturum cerezi icin 302 ile kendine
        # yonlendiriyor ve Location'i Host basligindan kuruyor; portsuz bir
        # Host gorunce "http://localhost/..." uretiyor, yani 80. Frontend
        # 80 disinda bir porttaysa tarayici bos bir porta gidiyor ve
        # YAYIN HIC BASLAMIYOR. 80'de calisirken gorunmuyor cunku orada
        # port zaten yazilmiyor.
        proxy_set_header Host $http_host;

        # Mutlak ve göreli Location'ların ikisini de yakalıyoruz: MediaMTX
        # sürümüne göre biçim değişebiliyor.
        #
        # DEGISTIRME ACIKCA $http_host ICERIYOR. Yalnizca "/hls/$1" yazildiginda
        # nginx adresi mutlaklastirirken PORTU DUSURUYOR ve tarayici
        # "http://localhost/hls/..." adresine, yani 80'e gidiyor. Frontend
        # baska bir porttaysa orada kimse yok ve yayin hic baslamiyor.
        # Olculdu: MediaMTX'in kendisi goreli donuyor ("/kanal1/index.m3u8"),
        # mutlak adresi ureten nginx.
        proxy_redirect ~^https?://[^/]+/(.*)$ $scheme://$http_host/hls/$1;
        proxy_redirect ~^/(.*)$ $scheme://$http_host/hls/$1;

        # Canlı manifest saniyeler içinde değişiyor; eski kopya oynatıcıyı
        # dondurur.
        add_header Cache-Control "no-cache, no-store" always;
    }

    location /docs {
        proxy_pass http://backend:8081;
        proxy_set_header Host $http_host;
    }

    # Hash'li varlık adları (index-CIIyV8kk.js) içerik değişince değişir,
    # bu yüzden uzun süre önbelleklenebilirler.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html önbelleklenmemeli; aksi halde yeni sürüm yayınlandığında
    # tarayıcı eski varlık adlarını istemeye devam eder.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
