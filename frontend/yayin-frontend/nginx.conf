server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Tek sayfa uygulaması: /klipler gibi bir adres doğrudan açıldığında
    # diskte o isimde dosya yok. index.html'e düşülmezse 404 alınır ve
    # yalnızca ana sayfadan gezinmek mümkün olur.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API istekleri backend'e. Geliştirmede aynı işi Vite proxy'si yapıyor;
    # her ikisinde de tarayıcı tek origin gördüğü için CORS devreye girmez.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Geriye sarma akışı uzun sürebilir; varsayılan 60 sn yetmez.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /docs {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
    }

    # Hash'li varlık adları (index-CIIyV8kk.js) içerik değişince değişir,
    # bu yüzden uzun süre önbelleklenebilirler.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html önbelleklenmemeli; aksi halde yeni sürüm yayınlandığında
    # tarayıcı eski varlık adlarını istemeye devam eder.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
