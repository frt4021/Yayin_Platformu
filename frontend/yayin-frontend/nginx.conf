server {
    listen 80;

    # Alan adı IDN olduğu için PUNYCODE yazılmalı: tarayıcı "yayın.com"u
    # ağa çıkarken "xn--yayn-nza.com"a çevirir ve nginx'e gelen Host başlığı
    # o hâlde olur. Unicode yazılsaydı hiçbir istek eşleşmezdi.
    #
    # "_" hepsini yakalayan varsayılan: IP ya da localhost ile erişim de
    # çalışmaya devam etsin.
    server_name xn--yayn-nza.com www.xn--yayn-nza.com localhost _;

    root /usr/share/nginx/html;

    # Yayın segmentleri büyük olabiliyor; varsayılan 1 MB sınırı yükleme
    # uçlarında da dar kalıyor.
    client_max_body_size 64m;

    # Tek sayfa uygulaması: /klipler gibi bir adres doğrudan açıldığında
    # diskte o isimde dosya yok. index.html'e düşülmezse 404 alınır ve
    # yalnızca ana sayfadan gezinmek mümkün olur.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API istekleri backend'e. Geliştirmede aynı işi Vite proxy'si yapıyor;
    # her ikisinde de tarayıcı tek origin gördüğü için CORS devreye girmez.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Geriye sarma akışı uzun sürebilir; varsayılan 60 sn yetmez.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # WebSocket — canlı altyazı akışı.
    #
    # Upgrade ve Connection başlıkları AÇIKÇA iletilmeli: nginx varsayılan
    # olarak hop-by-hop başlıkları düşürüyor ve el sıkışma sessizce
    # HTTP'ye düşüyor. Belirtisi "bağlantı kuruluyor ama mesaj gelmiyor".
    location /ws/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Canlı altyazıda mesajlar arası dakikalar geçebilir (sessizlik);
        # varsayılan 60 sn boşta kalma bağlantıyı koparırdı.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HLS yayını. Tek origin olması iki şey kazandırıyor:
    #   * CORS gerekmiyor,
    #   * izleyicinin ayrıca 8888 portuna erişebilmesi gerekmiyor.
    location /hls/ {
        proxy_pass http://mediamtx:8888/;
        proxy_set_header Host $host;

        # Manifest ÖNBELLEKLENMEMELİ: canlı yayında saniyeler içinde
        # değişiyor ve eski manifest oynatıcıyı dondurur.
        location ~ \.m3u8$ {
            proxy_pass http://mediamtx:8888;
            add_header Cache-Control "no-cache, no-store";
        }
    }

    location /docs {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
    }

    # Hash'li varlık adları (index-CIIyV8kk.js) içerik değişince değişir,
    # bu yüzden uzun süre önbelleklenebilirler.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html önbelleklenmemeli; aksi halde yeni sürüm yayınlandığında
    # tarayıcı eski varlık adlarını istemeye devam eder.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
