# Proje adi ACIKCA yaziliyor.
#
# Compose, verilmezse proje adini compose dosyasinin BULUNDUGU DIZINDEN
# turetiyor ve volume adlari da ona baglaniyor (proje_postgres_data gibi).
# Bu dosya src/main/docker altindan koke tasindiginda ad "docker"dan
# "yayinyonetim"e degisti ve compose BOS yeni volume'lar acti -- veritabani
# ve MinIO icerigi bir anda "kaybolmus" gibi gorundu. Adi sabitlemek bu
# tuzagi kalici olarak kapatiyor: dosya nereye tasinirsa tasinsin volume
# adlari degismez.
name: yayin-merkezi

networks:
  yayin-merkezi:
    driver: bridge

volumes:
  postgres_data:
  keycloak_postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:

  # --- Veritabanı (uygulama verisi) ---
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yayin_merkezi
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host'ta 5432'yi makinede kurulu PostgreSQL 14 servisi tutuyor;
      # container disariya 5433'ten acilir. Compose agi icinde adres yine postgres:5432.
      - "${PORT_POSTGRES:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yayin-merkezi

  # --- Keycloak için ayrı veritabanı ---
  keycloak-postgres:
    image: postgres:16
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change_me}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - yayin-merkezi

  # --- Kimlik yönetimi ---
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    restart: unless-stopped
    # --import-realm: keycloak/realm-export.json'daki realm ilk acilista
    # kurulur. Realm ZATEN VARSA dosya yok sayilir — yani bu dosyayi
    # degistirmek mevcut bir Keycloak'i guncellemez, yalnizca sifir
    # ortamlarda etkilidir.
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change_me}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change_me}
      # realm-export.json icindeki $(env:...) yer tutucularini Keycloak
      # bu degiskenlerden doldurur. Secret dosyaya yazilmaz.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change_me}
      # Prometheus /metrics ucu -- Keycloak 25'te yonetim arayuzunde ayri
      # portta (varsayilan 9000) acilabiliyor; gercek port ayaga kalkinca
      # container icinden dogrulanmali (bkz. prometheus.yml'deki not).
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./src/main/docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${PORT_KEYCLOAK:-8080}:8080"
    depends_on:
      - keycloak-postgres
    networks:
      - yayin-merkezi

  # --- Nesne depolama (video, kayıt, klip dosyaları) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}
      # /minio/v2/metrics/cluster ucunu kimlik dogrulamasiz acar -- dcgm-exporter/
      # Triton'la ayni yaklasim (ic agda kalan meta bilgi, veri degil).
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    ports:
      - "${PORT_MINIO_API:-9000}:9000"        # API
      - "${PORT_MINIO_CONSOLE:-9001}:9001"    # Web konsolu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - yayin-merkezi

  # --- Job queue / cache ---
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${PORT_REDIS:-6379}:6379"
    networks:
      - yayin-merkezi

  # --- Medya sunucusu (canlı yayın alma, HLS üretimi, DVR kaydı) ---
  mediamtx:
    # Ozel imaj: resmi imaj scratch tabanli, icinde ffmpeg yok. Cozunurluk
    # dusurme (transcode) runOnAvailable kancasiyla KONTEYNER ICINDE
    # calistigi icin ffmpeg oraya girmek zorunda. Imaj ayrica kendi VAAPI
    # surucusunu (iHD) tasiyor: host'taki surucu yalnizca CQP destekliyordu,
    # imajdaki CBR aciyor ve bit hizi hedeflenebiliyor.
    build:
      context: ./src/main/docker
      dockerfile: Dockerfile.mediamtx
    image: yayin/mediamtx:1.19.3
    container_name: mediamtx
    restart: unless-stopped
    # Donanim kodlayici. Hangi GPU'nun kullanilacagi .env ile belirleniyor;
    # ayri bir compose dosyasi yok (bkz. README "Donanim kodlayici").
    #
    #   Intel/AMD (VAAPI) : MEDIA_DEVICE=/dev/dri:/dev/dri   (varsayilan)
    #   NVIDIA (NVENC)    : CONTAINER_RUNTIME=nvidia
    #                       NVIDIA_VISIBLE_DEVICES=all
    #                       NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
    #                       MEDIA_DEVICE=/dev/null:/dev/null
    #
    # MEDIA_DEVICE neden gerekli: NVIDIA sunucularinda /dev/dri bulunmayabilir
    # ve sabit yazilirsa konteyner hic baslamaz. /dev/null zararsiz bir yer
    # tutucu.
    runtime: ${CONTAINER_RUNTIME:-runc}
    devices:
      - ${MEDIA_DEVICE:-/dev/dri:/dev/dri}
    environment:
      # NVIDIA kullanilmiyorsa bos kalir ve hicbir etkisi olmaz.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-}

    volumes:
      - ./src/main/docker/mediamtx.yml:/mediamtx.yml
      # Adlandirilmis volume yerine host dizinleri: uretilen manifest,
      # segment ve kayit dosyalari dosya yoneticisinden dogrudan gorulebilsin.
      - ./src/main/docker/mediamtx-data/hls:/hls
    ports:
      - "${PORT_RTSP:-8554}:8554"             # RTSP
      - "${PORT_HLS:-8888}:8888"              # HLS/HTTP
      - "${PORT_MEDIAMTX_API:-9997}:9997"     # REST API (dinamik path yönetimi)
      - "${PORT_MEDIAMTX_METRICS:-9998}:9998" # Prometheus metrikleri (mediamtx.yml: metrics/metricsAddress)
    networks:
      - yayin-merkezi

  backend:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    image: yayin/backend:${IMAGE_TAG:-latest}
    container_name: backend
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yayin_merkezi

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-Yayın_App}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change_me}

      MEDIAMTX_API_URL: http://mediamtx:9997
      # TARAYICI'nin cozecegi adres. "mediamtx" ismi ag ici; disaridan
      # erisilen adres yazilmali yoksa oynatici yayini bulamaz.
      MEDIAMTX_HLS_BASE_URL: ${MEDIAMTX_HLS_BASE_URL:-http://localhost:8888}

      # Admin panelin "Genel Bakış" servis detay metrikleri buradan okunuyor.
      PROMETHEUS_URL: http://prometheus:9090
      # Admin panelin "Sistem Logları" ekranı buradan okunuyor.
      LOKI_URL: http://loki:3100
      # Altyazı dil seçici buradan besleniyor (OynaticiAyarResource) --
      # video-worker'daki VadService ile AYNI liste olmalı, triton build
      # argümanıyla da (bkz. triton servisi) TUTARLI kalmalı.
      STT_TARGET_LANGS: ${STT_TARGET_LANGS:-tr,de,ru}

      # Rendition kodlayicisi: VAAPI | NVENC | YAZILIM
      # Komutu backend uretiyor ama KODLAMA mediamtx konteynerinde calisiyor;
      # bu yuzden deger oradaki donanima gore secilmeli.
      CHANNELS_ENCODER: ${CHANNELS_ENCODER:-VAAPI}
      CHANNELS_MAX_ACTIVE: ${CHANNELS_MAX_ACTIVE:-16}
      CHANNELS_RENDITION_START_TIMEOUT: ${CHANNELS_RENDITION_START_TIMEOUT:-15s}
      CHANNELS_RENDITION_CLOSE_AFTER: ${CHANNELS_RENDITION_CLOSE_AFTER:-60s}

      MINIO_ENDPOINT: http://minio:9000
      # Imzali indirme adresleri tarayicida acilir; S3 imzasi Host basligini
      # de kapsadigi icin adresi sonradan degistirmek imkansiz.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}

      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Saklama politikasi. Sureler GUN ya da SAAT olarak yazilabilir:
      #   P30D = 30 gun · 720h = ayni sure · PT12H = 12 saat · 0 = KAPALI
      # Varsayilan olarak kullanici verisi silinmiyor; baskiyi kota kuruyor.
      STORAGE_CLIP_RETENTION: ${STORAGE_CLIP_RETENTION:-0}
      STORAGE_SCREENSHOT_RETENTION: ${STORAGE_SCREENSHOT_RETENTION:-0}
      STORAGE_FAILED_CLIP_RETENTION: ${STORAGE_FAILED_CLIP_RETENTION:-P7D}
      STORAGE_SUBTITLE_RETENTION: ${STORAGE_SUBTITLE_RETENTION:-0}
      STORAGE_SWEEP_INTERVAL: ${STORAGE_SWEEP_INTERVAL:-1h}
      STORAGE_USER_QUOTA_BYTES: ${STORAGE_USER_QUOTA_BYTES:-21474836480}

      # Ekran goruntusu galerisi
      SCREENSHOTS_BUCKET: ${SCREENSHOTS_BUCKET:-ekran-goruntuleri}
      SCREENSHOTS_URL_TTL_HOURS: ${SCREENSHOTS_URL_TTL_HOURS:-6}
      SCREENSHOTS_MAX_BYTES: ${SCREENSHOTS_MAX_BYTES:-10485760}

      # VAD ve DVR kaydi burada DEGIL: bu imajda ffmpeg yok. Bkz. video-worker.
      # Video isleri ayri konteynerde (ffmpeg burada yok). Klipler burada
      # kaliyor: onlarin isi MediaMTX'ten akis cekmek, ffmpeg gerektirmiyor.
      VIDEOS_WORKER_ENABLED: "false"
      CLIPS_WORKER_ENABLED: "true"
      DVR_RECORDER_ENABLED: "false"

      # Okuma tarafi backend'de: kova adi ve saklama suresi burada da gerekli
      # (kovayi ve ILM kuralini acilista hazirlayan taraf).
      DVR_BUCKET: ${DVR_BUCKET:-dvr}
      DVR_RETENTION_DAYS: ${DVR_RETENTION_DAYS:-7}
    depends_on:
      - postgres
      - keycloak
      - minio
      - redis
      - mediamtx
    ports:
      - "${PORT_BACKEND:-8090}:8081"
    networks:
      - yayin-merkezi

  # --- Video isleme iscisi ---
  # Backend ile AYNI jar, ustune ffmpeg eklenmis imaj. Ayri olmasinin sebebi
  # ffmpeg'in backend imajini ~300 MB buyutmesi ve REST surecinin onu hic
  # kullanmamasi. Sorumluluk ayrimi ortam degiskenleriyle yapiliyor.

  # --- Triton (Whisper + Marian) ---
  # AYRI SERVIS. Gerekcesi: faster-whisper/optimum + CUDA calisma zamani +
  # modeller ~5-6 GB eder ve GPU yalnizca buraya gerekiyor. video-worker'i bu
  # boyuta cikarmanin ve onu GPU'ya baglamanin anlami yok.
  #
  # Varsayilan CPU: bu makinede GPU yoksa mimari CPU'da dogrulanabiliyor.
  # Uretimde GPU icin .env'de:
  #   STT_DEVICE=cuda        <- taban imaj ve torch bundan turuyor
  #   STT_RUNTIME=nvidia     <- GPU'yu konteynere acar
  #   STT_MODEL=large-v3
  #   STT_COMPUTE_TYPE=int8_float16
  # stt-worker'in (bkz. git gecmisi) yerini aldi -- triton-uygulama.md +
  # bu oturumda netlesen kararlar: VAD Java'da kaliyor, sequence_batching
  # YOK (Whisper stateless), Marian ONNX+optimum ile Python backend'de.
  #
  # instance_group.count'lar BUILD ARG DEGIL, calisma zamani env degiskeni:
  # entrypoint.sh container acilirken config.pbtxt'lere envsubst ile
  # yaziyor. Yani WHISPER_INSTANCES/MARIAN_*_INSTANCES'i .env'de degistirip
  # sadece `docker compose up -d triton` (REBUILD GEREKMEZ) yeterli.
  triton:
    build:
      context: ./triton
      args:
        # SINIRSIZ dil listesi -- "tr,de,ru,fr,es,..." gibi istenildigi kadar
        # kod eklenebilir, her biri icin export_models.py config.pbtxt/
        # model.py'yi kendisi uretiyor (bkz. triton/export_models.py,
        # "TAM DINAMIK MARIAN"). Rebuild GEREKIR (build-arg, calisma zamani
        # degil) -- agirliklar offline calisma icin build'de gomuluyor.
        STT_MODEL: ${STT_MODEL:-small}
        STT_TARGET_LANGS: ${STT_TARGET_LANGS:-tr,de,ru}
        # Format: "tr=Helsinki-NLP/opus-mt-tc-big-en-tr,fr=org/model" --
        # yalnizca "Helsinki-NLP/opus-mt-en-<kod>" varsayimindan SAPAN diller
        # icin gerekli, geri kalani otomatik turetilir.
        MARIAN_MODELS: ${MARIAN_MODELS:-}
        MARIAN_EXPORT_DTYPE: ${MARIAN_EXPORT_DTYPE:-fp16}
    image: yayin/triton:${IMAGE_TAG:-latest}
    container_name: triton
    restart: unless-stopped
    environment:
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-5}
      # PyTorch'un kendi OOM hata mesajinin onerdigi bayrak -- saatlerce
      # surmus OOM/retry dongusunden sonra CUDA bellek havuzunun kucuk
      # parcalara bolunmesini (fragmentation) azaltmak icin. Olculdu:
      # 15 Agustos'ta VRAM doluluk orani BUGUNKUYLE AYNIYDI (~5.6-5.8GB)
      # ama istek basi gecikme 20-30 kat dusuktu (docs/altyazi-hata-
      # analizi-16-agustos.md) -- tek fark parcalanma olabilir.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # 6GB kartta whisper darbogaz oldugu icin varsayilan 2 -- Marian
      # modelleri (ozellikle en_de/en_ru) daha ucuz, ayri ayri artirilabilir.
      # VRAM tepe degeri her degisiklikte OLCULMELI (docs/triton gecis plani,
      # Bolum 7 -- tahmin, dogrulanmadi).
      WHISPER_INSTANCES: ${WHISPER_INSTANCES:-2}
      # SINIRSIZ dil, SINIRSIZ instance -- format "tr=2,fr=3" (yalnizca
      # varsayilandan SAPAN diller icin), listede olmayan HER dil
      # MARIAN_INSTANCES_DEFAULT'u kullanir. REBUILD GEREKMEZ -- ikisi de
      # calisma zamani env degiskeni, container'i yeniden baslatmak yeterli
      # (bkz. triton/entrypoint.sh, "TAM DINAMIK MARIAN").
      MARIAN_INSTANCES: ${MARIAN_INSTANCES:-}
      MARIAN_INSTANCES_DEFAULT: ${MARIAN_INSTANCES_DEFAULT:-1}
    runtime: ${STT_RUNTIME:-runc}
    # Docker'in varsayilani (1024) whisper+3 Marian'in her biri ayri Python
    # stub sureci olarak actigi CUDA/ONNX/IPC tanitici sayisina yetmiyor --
    # olculdu: 1024/1024 doluyor, "Too many open files" ile accept() cokuyor
    # ve healthcheck'in her yeni baglantisi reddediliyor (docs/altyazi-hata-
    # analizi-16-agustos.md, Bolum 1).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    ports:
      - "127.0.0.1:${PORT_TRITON_HTTP:-8100}:8000"
      - "127.0.0.1:${PORT_TRITON_METRICS:-8002}:8002"
    networks:
      - yayin-merkezi

  video-worker:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.worker
    image: yayin/video-worker:${IMAGE_TAG:-latest}
    container_name: video-worker
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yayin_merkezi

      # Isci REST sunmuyor ama OIDC yapilandirmasi acilis icin gerekli.
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-Yayın_App}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change_me}

      MEDIAMTX_API_URL: http://mediamtx:9997

      MINIO_ENDPOINT: http://minio:9000
      # Isci ffmpeg'e IC agdaki imzali adresi veriyor (VideoStorage
      # .internalReadUrl), yani MINIO_ENDPOINT uzerinden. Buradaki public-url
      # yalnizca bean uretimi icin gerekli; isci disariya adres sunmuyor.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}

      REDIS_URL: redis://redis:6379

      # VAD BURADA calisir, backend'de degil: ses cikarma ffmpeg gerektiriyor
      # ve backend imajinda ffmpeg YOK (dogrulandi). Varsayilan KAPALI --
      # yarim hat uretimde kendiliginden calismasin.
      #
      # VAD_MODEL_VERSION kozmetik DEGIL, modelin girdi bicimini belirliyor:
      #   v4 -> 1536 ornek kare, baglam yok, h/c ayri tensor
      #   v5 ->  512 ornek kare, 64 ornek baglam, tek state tensoru
      # Yanlis surumde ya ONNX patlar (iyi senaryo) ya da SESSIZCE bos
      # altyazi uretir -- olculdu: baglamsiz cagrimda konusma orani %97
      # yerine %0 cikiyor.
      VAD_ENABLED: ${VAD_ENABLED:-false}
      VAD_MODEL_PATH: ${VAD_MODEL_PATH:-/models/silero_vad.onnx}
      VAD_MODEL_VERSION: ${VAD_MODEL_VERSION:-v5}
      VAD_MAX_CHANNELS: ${VAD_MAX_CHANNELS:-20}
      VAD_SEGMENT_DIR: ${VAD_SEGMENT_DIR:-/vad-bolutler}
      VAD_MAX_SEGMENT_MS: ${VAD_MAX_SEGMENT_MS:-6000}
      VAD_MIN_SILENCE_MS: ${VAD_MIN_SILENCE_MS:-400}
      VAD_MIN_EMIT_MS: ${VAD_MIN_EMIT_MS:-0}
      VAD_OVERLAP_MS: ${VAD_OVERLAP_MS:-800}
      # Container-ici port HER ZAMAN 8000 -- yukaridaki PORT_TRITON_HTTP
      # sadece HOST makineden erisim icin, servisler arasi trafik container
      # adi + ic port ile gidiyor.
      TRITON_URL: ${TRITON_URL:-http://triton:8000}
      VAD_STT_ENABLED: ${VAD_STT_ENABLED:-true}
      # Triton servisindeki STT_TARGET_LANGS (build-arg) ile AYNI liste
      # olmali -- burasi VadService'in kac dil icin ceviri istegi acacagini
      # belirliyor, orasi hangi marian_en_<kod> modellerinin export
      # edildigini. Ikisi uyusmazsa Triton'da olmayan bir model istenir.
      STT_TARGET_LANGS: ${STT_TARGET_LANGS:-tr,de,ru}
      # Triton'a gecisle asil eszamanlilik/batching instance_group+
      # dynamic_batching ile Triton icinde yonetiliyor -- bu deger artik
      # yalnizca Java tarafindaki gonderici thread sayisini sinirliyor.
      STT_MAX_CONCURRENCY: ${STT_MAX_CONCURRENCY:-2}
      MEDIAMTX_RTSP_URL: ${MEDIAMTX_RTSP_URL:-rtsp://mediamtx:8554}

      # DVR kaydi BURADA: ffmpeg gerektiriyor ve backend imajinda ffmpeg yok.
      # Ayni jar iki konteynerde calistigi icin bayrak sart -- backend de
      # acik olsaydi her segment iki kez yazilirdi.
      DVR_RECORDER_ENABLED: "true"
      DVR_SEGMENT_SECONDS: ${DVR_SEGMENT_SECONDS:-30}
      DVR_BUCKET: ${DVR_BUCKET:-dvr}
      DVR_RETENTION_DAYS: ${DVR_RETENTION_DAYS:-7}

      # Kanal ön izleme kareleri BURADA: ffmpeg gerektiriyor, ayni gerekce.
      CHANNELS_SNAPSHOT_ENABLED: "true"
      CHANNELS_SNAPSHOT_INTERVAL: ${CHANNELS_SNAPSHOT_INTERVAL:-30s}

      # Sorumluluk ayrimi: video isleri BURADA, klipler backend'de.
      VIDEOS_WORKER_ENABLED: "true"
      CLIPS_WORKER_ENABLED: "false"
      VIDEOS_CONCURRENCY: ${VIDEOS_CONCURRENCY:-2}

      # Yuklenen videolar icin altyazi -- video isleme kuyrugundan AYRI,
      # Triton/GPU'ya bagli ve dakikalar surebilir. Varsayilan kapali.
      VIDEOS_SUBTITLE_ENABLED: ${VIDEOS_SUBTITLE_ENABLED:-false}
      VIDEOS_SUBTITLE_CONCURRENCY: ${VIDEOS_SUBTITLE_CONCURRENCY:-1}
      VIDEOS_SUBTITLE_QUEUE_KEY: ${VIDEOS_SUBTITLE_QUEUE_KEY:-video-altyazi-kuyrugu}

      # Onizleme klibi kodlayicisi: YAZILIM | VAAPI | NVENC
      # Varsayilan YAZILIM -- 5 saniyelik 480p klip zaten saniyeler icinde
      # kodlaniyor ve aygit gecirilmesini gerektirmiyor.
      #
      # Donanim secimi .env ile (bkz. README "Donanim kodlayici").
      VIDEOS_ENCODER: ${VIDEOS_ENCODER:-YAZILIM}

      # NVIDIA kullanilmiyorsa bos kalir ve hicbir etkisi olmaz.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-}

      # Flyway backend'de calisiyor; iki surecin ayni semayi migrate etmeye
      # calismasi yaris durumu yaratirdi.
      QUARKUS_FLYWAY_MIGRATE_AT_START: "false"
    runtime: ${CONTAINER_RUNTIME:-runc}
    # Varsayilan /dev/null: worker'a aygit gerekmiyor (YAZILIM kodlama).
    # VAAPI icin WORKER_MEDIA_DEVICE=/dev/dri:/dev/dri verin.
    devices:
      - ${WORKER_MEDIA_DEVICE:-/dev/null:/dev/null}
    # VAD bolutleri HOST'a baglaniyor: dogrulamanin tek gercek yolu WAV'lari
    # kulakla dinlemek ve konteyner icinde kalsalardi hem erisilemez hem de
    # her yeniden baslatmada kaybolur olurlardi.
    volumes:
      - ./vad-bolutler:${VAD_SEGMENT_DIR:-/vad-bolutler}
    depends_on:
      - postgres
      - minio
      - redis
    networks:
      - yayin-merkezi

  frontend:
    build:
      context: ./frontend/yayin-frontend
    image: yayin/frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT_FRONTEND:-3000}:80"
    networks:
      - yayin-merkezi

  # --- İzleme: GPU donanım metrikleri ---
  #
  # NVIDIA'nin kendi exporter'i -- STT_MAX_CONCURRENCY gibi ayarlarin GPU'yu
  # gercekten ne kadar doldurdugunu (util, VRAM, SM occupancy) Prometheus'a
  # tasir. GPU yoksa (CONTAINER_RUNTIME=runc) bu servis anlamsiz -- yine de
  # ayakta kalir, /metrics bos/hatali doner, Prometheus hedefi "down" gosterir.
  #
  # SM occupancy/profiling alanlari (DCGM_FI_PROF_*) bazi tuketici kartlarda
  # (GeForce) hic raporlanmayabilir -- bu, DCGM'in surucu/kart sinirlamasi,
  # buradaki yapilandirmanin degil.
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    runtime: ${CONTAINER_RUNTIME:-runc}
    cap_add:
      - SYS_ADMIN
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-}
    ports:
      - "${PORT_DCGM:-9400}:9400"
    networks:
      - yayin-merkezi

  # --- İzleme: Postgres metrikleri (uygulama veritabanı) ---
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/yayin_merkezi?sslmode=disable
    ports:
      - "${PORT_POSTGRES_EXPORTER:-9187}:9187"
    depends_on:
      - postgres
    networks:
      - yayin-merkezi

  # --- İzleme: Postgres metrikleri (Keycloak veritabanı) ---
  #
  # Ayrı container: postgres_exporter tek DSN izliyor, iki instance icin tek
  # exporter'la ikisini birden izlemek ekstra multi-target kurulumu gerektirir.
  keycloak-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: keycloak-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${KEYCLOAK_DB_USER:-keycloak}:${KEYCLOAK_DB_PASSWORD:-change_me}@keycloak-postgres:5432/keycloak?sslmode=disable
    ports:
      - "${PORT_KEYCLOAK_POSTGRES_EXPORTER:-9188}:9187"
    depends_on:
      - keycloak-postgres
    networks:
      - yayin-merkezi

  # --- İzleme: Redis metrikleri ---
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "${PORT_REDIS_EXPORTER:-9121}:9121"
    depends_on:
      - redis
    networks:
      - yayin-merkezi

  # --- İzleme: altyazı kuyruğu metrikleri ---
  #
  # Backend ve video-worker AYNI jar oldugu icin ikisi de /q/metrics acar;
  # gercek kuyruk degerleri (VadService) yalnizca video-worker'da olusuyor.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./src/main/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PORT_PROMETHEUS:-9090}:9090"
    depends_on:
      - backend
      - video-worker
      - dcgm-exporter
      - mediamtx
      - postgres-exporter
      - keycloak-postgres-exporter
      - redis-exporter
      - minio
      - keycloak
    networks:
      - yayin-merkezi

  # --- İzleme: log toplama (Loki) ---
  #
  # Denetim/arsiv sistemi DEGIL -- kisa saklama sureli (7 gun), operasyonel
  # gorunurluk. Backend Loki'nin HTTP API'sine (LogQL) sorgu atiyor (bkz.
  # org.example.sistemlog.LokiClient) -- docker.sock'a hic dokunmuyor.
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./src/main/docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - yayin-merkezi

  # --- İzleme: log toplama (Promtail) ---
  #
  # docker.sock'a dokunan TEK bilesen (salt-okunur) -- resmi, dar kapsamli
  # Grafana araci, yalnizca log okuyor. Backend'in kendisi asla docker
  # API'sine dogrudan erismiyor.
  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./src/main/docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - yayin-merkezi

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Ilk acilista sifre degistirme istemesin -- yerel/kurum ici kullanim.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./src/main/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${PORT_GRAFANA:-3001}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - yayin-merkezi