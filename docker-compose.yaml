# Proje adi ACIKCA yaziliyor.
#
# Compose, verilmezse proje adini compose dosyasinin BULUNDUGU DIZINDEN
# turetiyor ve volume adlari da ona baglaniyor (proje_postgres_data gibi).
# Bu dosya src/main/docker altindan koke tasindiginda ad "docker"dan
# "yayinyonetim"e degisti ve compose BOS yeni volume'lar acti -- veritabani
# ve MinIO icerigi bir anda "kaybolmus" gibi gorundu. Adi sabitlemek bu
# tuzagi kalici olarak kapatiyor: dosya nereye tasinirsa tasinsin volume
# adlari degismez.
name: yayin-merkezi

networks:
  yayin-merkezi:
    driver: bridge

volumes:
  postgres_data:
  keycloak_postgres_data:
  minio_data:
  mediamtx_recordings:

services:

  # --- Veritabanı (uygulama verisi) ---
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yayin_merkezi
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host'ta 5432'yi makinede kurulu PostgreSQL 14 servisi tutuyor;
      # container disariya 5433'ten acilir. Compose agi icinde adres yine postgres:5432.
      - "${PORT_POSTGRES:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yayin-merkezi

  # --- Keycloak için ayrı veritabanı ---
  keycloak-postgres:
    image: postgres:16
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change_me}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - yayin-merkezi

  # --- Kimlik yönetimi ---
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    restart: unless-stopped
    # --import-realm: keycloak/realm-export.json'daki realm ilk acilista
    # kurulur. Realm ZATEN VARSA dosya yok sayilir — yani bu dosyayi
    # degistirmek mevcut bir Keycloak'i guncellemez, yalnizca sifir
    # ortamlarda etkilidir.
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change_me}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change_me}
      # realm-export.json icindeki $(env:...) yer tutucularini Keycloak
      # bu degiskenlerden doldurur. Secret dosyaya yazilmaz.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change_me}
    volumes:
      - ./src/main/docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${PORT_KEYCLOAK:-8080}:8080"
    depends_on:
      - keycloak-postgres
    networks:
      - yayin-merkezi

  # --- Nesne depolama (video, kayıt, klip dosyaları) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}
    volumes:
      - minio_data:/data
    ports:
      - "${PORT_MINIO_API:-9000}:9000"        # API
      - "${PORT_MINIO_CONSOLE:-9001}:9001"    # Web konsolu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - yayin-merkezi

  # --- Job queue / cache ---
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${PORT_REDIS:-6379}:6379"
    networks:
      - yayin-merkezi

  # --- Medya sunucusu (canlı yayın alma, HLS üretimi, DVR kaydı) ---
  mediamtx:
    # Ozel imaj: resmi imaj scratch tabanli, icinde ffmpeg yok. Cozunurluk
    # dusurme (transcode) runOnAvailable kancasiyla KONTEYNER ICINDE
    # calistigi icin ffmpeg oraya girmek zorunda. Imaj ayrica kendi VAAPI
    # surucusunu (iHD) tasiyor: host'taki surucu yalnizca CQP destekliyordu,
    # imajdaki CBR aciyor ve bit hizi hedeflenebiliyor.
    build:
      context: ./src/main/docker
      dockerfile: Dockerfile.mediamtx
    image: yayin/mediamtx:1.19.3
    container_name: mediamtx
    restart: unless-stopped
    # Donanim kodlayici. Hangi GPU'nun kullanilacagi .env ile belirleniyor;
    # ayri bir compose dosyasi yok (bkz. README "Donanim kodlayici").
    #
    #   Intel/AMD (VAAPI) : MEDIA_DEVICE=/dev/dri:/dev/dri   (varsayilan)
    #   NVIDIA (NVENC)    : CONTAINER_RUNTIME=nvidia
    #                       NVIDIA_VISIBLE_DEVICES=all
    #                       NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
    #                       MEDIA_DEVICE=/dev/null:/dev/null
    #
    # MEDIA_DEVICE neden gerekli: NVIDIA sunucularinda /dev/dri bulunmayabilir
    # ve sabit yazilirsa konteyner hic baslamaz. /dev/null zararsiz bir yer
    # tutucu.
    runtime: ${CONTAINER_RUNTIME:-runc}
    devices:
      - ${MEDIA_DEVICE:-/dev/dri:/dev/dri}
    environment:
      # NVIDIA kullanilmiyorsa bos kalir ve hicbir etkisi olmaz.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-}

      # DVR saklama suresi. MediaMTX MTX_ onekli degiskenlerle mediamtx.yml'i
      # eziyor, boylece dosyayi degistirmeden ayarlanabiliyor.
      #
      # DIKKAT: disk hesabi buna bagli. 6 Mbps'lik bir kanal saatte ~2,7 GB
      # yaziyor; 16 kanal x 7 gun ~= 7,3 TB. Sureyi uzatmadan once diski
      # kontrol edin, yoksa disk dolunca TUM kayitlar durur.
      MTX_PATHDEFAULTS_RECORDDELETEAFTER: ${DVR_RETENTION:-168h}
    volumes:
      - ./src/main/docker/mediamtx.yml:/mediamtx.yml
      # Adlandirilmis volume yerine host dizinleri: uretilen manifest,
      # segment ve kayit dosyalari dosya yoneticisinden dogrudan gorulebilsin.
      - ./src/main/docker/mediamtx-data/hls:/hls
      # DVR kayitlari. Uretimde buyuk diski DVR_PATH ile gosterin:
      #   DVR_PATH=/mnt/dvr docker compose up -d
      # 16 kanal x 7 gun x 6 Mbps ~= 7.3 TB; %20 payla 8.7 TB disk gerekir.
      - ${DVR_PATH:-./src/main/docker/mediamtx-data/recordings}:/recordings
    ports:
      - "${PORT_RTSP:-8554}:8554"             # RTSP
      - "${PORT_HLS:-8888}:8888"              # HLS/HTTP
      - "${PORT_MEDIAMTX_API:-9997}:9997"     # REST API (dinamik path yönetimi)
      # Geri sarma sunucusu. Yalnizca 127.0.0.1'e baglanir: gelistirmede
      # host'taki backend erisebilsin diye acik, ama agdan erisilemez.
      # Uretimde backend compose aginda oldugu icin bu satir kaldirilabilir.
      - "127.0.0.1:${PORT_PLAYBACK:-9996}:9996"
    networks:
      - yayin-merkezi

  backend:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: backend
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yayin_merkezi

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-Yayın_App}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change_me}

      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_PLAYBACK_URL: http://mediamtx:9996
      # TARAYICI'nin cozecegi adres. "mediamtx" ismi ag ici; disaridan
      # erisilen adres yazilmali yoksa oynatici yayini bulamaz.
      MEDIAMTX_HLS_BASE_URL: ${MEDIAMTX_HLS_BASE_URL:-http://localhost:8888}

      # Rendition kodlayicisi: VAAPI | NVENC | YAZILIM
      # Komutu backend uretiyor ama KODLAMA mediamtx konteynerinde calisiyor;
      # bu yuzden deger oradaki donanima gore secilmeli.
      CHANNELS_ENCODER: ${CHANNELS_ENCODER:-VAAPI}

      MINIO_ENDPOINT: http://minio:9000
      # Imzali indirme adresleri tarayicida acilir; S3 imzasi Host basligini
      # de kapsadigi icin adresi sonradan degistirmek imkansiz.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}

      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Saklama politikasi. Sureler GUN ya da SAAT olarak yazilabilir:
      #   P30D = 30 gun · 720h = ayni sure · PT12H = 12 saat · 0 = KAPALI
      # Varsayilan olarak kullanici verisi silinmiyor; baskiyi kota kuruyor.
      STORAGE_CLIP_RETENTION: ${STORAGE_CLIP_RETENTION:-0}
      STORAGE_SCREENSHOT_RETENTION: ${STORAGE_SCREENSHOT_RETENTION:-0}
      STORAGE_FAILED_CLIP_RETENTION: ${STORAGE_FAILED_CLIP_RETENTION:-P7D}
      STORAGE_SWEEP_INTERVAL: ${STORAGE_SWEEP_INTERVAL:-1h}
      STORAGE_USER_QUOTA_BYTES: ${STORAGE_USER_QUOTA_BYTES:-21474836480}

      # Ekran goruntusu galerisi
      SCREENSHOTS_BUCKET: ${SCREENSHOTS_BUCKET:-ekran-goruntuleri}
      SCREENSHOTS_URL_TTL_HOURS: ${SCREENSHOTS_URL_TTL_HOURS:-6}
      SCREENSHOTS_MAX_BYTES: ${SCREENSHOTS_MAX_BYTES:-10485760}

      # VAD burada DEGIL: bu imajda ffmpeg yok. Bkz. video-worker.
      # Video isleri ayri konteynerde (ffmpeg burada yok). Klipler burada
      # kaliyor: onlarin isi MediaMTX'ten akis cekmek, ffmpeg gerektirmiyor.
      VIDEOS_WORKER_ENABLED: "false"
      CLIPS_WORKER_ENABLED: "true"
    depends_on:
      - postgres
      - keycloak
      - minio
      - redis
      - mediamtx
    ports:
      - "${PORT_BACKEND:-8090}:8081"
    networks:
      - yayin-merkezi

  # --- Video isleme iscisi ---
  # Backend ile AYNI jar, ustune ffmpeg eklenmis imaj. Ayri olmasinin sebebi
  # ffmpeg'in backend imajini ~300 MB buyutmesi ve REST surecinin onu hic
  # kullanmamasi. Sorumluluk ayrimi ortam degiskenleriyle yapiliyor.
  # STT — AYRI SERVIS. Gerekcesi: faster-whisper + CUDA calisma zamani +
  # modeller ~5-6 GB eder ve GPU yalnizca buraya gerekiyor. video-worker'i bu
  # boyuta cikarmanin ve onu GPU'ya baglamanin anlami yok.
  #
  # Varsayilan CPU ve `small` model: bu makinede GPU yok ve mimari CPU'da
  # dogrulanabiliyor. Uretimde GPU icin .env'de:
  #   STT_DEVICE=cuda        <- taban imaj ve torch bundan turuyor
  #   STT_RUNTIME=nvidia     <- GPU'yu konteynere acar
  #   STT_MODEL=large-v3
  #   STT_COMPUTE_TYPE=int8_float16
  stt-worker:
    build:
      context: ./stt-worker
      args:
        # TEK degisken: taban imaj ve torch indeksi Dockerfile'da bundan
        # turetiliyor. Ayri ayri verilseydi (taban CUDA ama torch CPU gibi)
        # sessizce CPU'da calisan bir GPU kurulumu cikardi.
        STT_DEVICE: ${STT_DEVICE:-cpu}
        STT_MODEL: ${STT_MODEL:-small}
        STT_TARGET_LANGS: ${STT_TARGET_LANGS:-tr,de,ru}
    image: yayin/stt-worker:latest
    container_name: stt-worker
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_MODEL:-small}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-5}
      STT_BATCH_SIZE: ${STT_BATCH_SIZE:-8}
      STT_MAX_CONCURRENCY: ${STT_MAX_CONCURRENCY:-2}
      STT_TARGET_LANGS: ${STT_TARGET_LANGS:-tr,de,ru}
      STT_LOG_LEVEL: ${STT_LOG_LEVEL:-INFO}
    # STT_DEVICE=cuda ise burasi da nvidia olmali. Ikisi AYRI kavram:
    #   imaj  -> CUDA kutuphanelerini ICERIR   (build zamani)
    #   runtime -> GPU'yu konteynere ACAR      (calisma zamani)
    # Yalnizca biri degistirilirse GPU ya gorunmez ya kullanilamaz.
    # yapilandir.sh ikisini birlikte yaziyor.
    runtime: ${STT_RUNTIME:-runc}
    ports:
      - "127.0.0.1:${PORT_STT:-8100}:8100"
    networks:
      - yayin-merkezi

  video-worker:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.worker
    image: yayin/video-worker:latest
    container_name: video-worker
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yayin_merkezi

      # Isci REST sunmuyor ama OIDC yapilandirmasi acilis icin gerekli.
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-YayinYonetimi}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-Yayın_App}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change_me}

      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_PLAYBACK_URL: http://mediamtx:9996

      MINIO_ENDPOINT: http://minio:9000
      # Isci ffmpeg'e IC agdaki imzali adresi veriyor (VideoStorage
      # .internalReadUrl), yani MINIO_ENDPOINT uzerinden. Buradaki public-url
      # yalnizca bean uretimi icin gerekli; isci disariya adres sunmuyor.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}

      REDIS_URL: redis://redis:6379

      # VAD BURADA calisir, backend'de degil: ses cikarma ffmpeg gerektiriyor
      # ve backend imajinda ffmpeg YOK (dogrulandi). Varsayilan KAPALI --
      # yarim hat uretimde kendiliginden calismasin.
      #
      # VAD_MODEL_VERSION kozmetik DEGIL, modelin girdi bicimini belirliyor:
      #   v4 -> 1536 ornek kare, baglam yok, h/c ayri tensor
      #   v5 ->  512 ornek kare, 64 ornek baglam, tek state tensoru
      # Yanlis surumde ya ONNX patlar (iyi senaryo) ya da SESSIZCE bos
      # altyazi uretir -- olculdu: baglamsiz cagrimda konusma orani %97
      # yerine %0 cikiyor.
      VAD_ENABLED: ${VAD_ENABLED:-false}
      VAD_MODEL_PATH: ${VAD_MODEL_PATH:-/models/silero_vad.onnx}
      VAD_MODEL_VERSION: ${VAD_MODEL_VERSION:-v5}
      VAD_MAX_CHANNELS: ${VAD_MAX_CHANNELS:-20}
      VAD_SEGMENT_DIR: ${VAD_SEGMENT_DIR:-/vad-bolutler}
      STT_URL: ${STT_URL:-http://stt-worker:8100}
      VAD_STT_ENABLED: ${VAD_STT_ENABLED:-true}
      MEDIAMTX_RTSP_URL: ${MEDIAMTX_RTSP_URL:-rtsp://mediamtx:8554}

      # Sorumluluk ayrimi: video isleri BURADA, klipler backend'de.
      VIDEOS_WORKER_ENABLED: "true"
      CLIPS_WORKER_ENABLED: "false"
      VIDEOS_CONCURRENCY: ${VIDEOS_CONCURRENCY:-2}

      # Onizleme klibi kodlayicisi: YAZILIM | VAAPI | NVENC
      # Varsayilan YAZILIM -- 5 saniyelik 480p klip zaten saniyeler icinde
      # kodlaniyor ve aygit gecirilmesini gerektirmiyor.
      #
      # Donanim secimi .env ile (bkz. README "Donanim kodlayici").
      VIDEOS_ENCODER: ${VIDEOS_ENCODER:-YAZILIM}

      # NVIDIA kullanilmiyorsa bos kalir ve hicbir etkisi olmaz.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-}

      # Flyway backend'de calisiyor; iki surecin ayni semayi migrate etmeye
      # calismasi yaris durumu yaratirdi.
      QUARKUS_FLYWAY_MIGRATE_AT_START: "false"
    runtime: ${CONTAINER_RUNTIME:-runc}
    # Varsayilan /dev/null: worker'a aygit gerekmiyor (YAZILIM kodlama).
    # VAAPI icin WORKER_MEDIA_DEVICE=/dev/dri:/dev/dri verin.
    devices:
      - ${WORKER_MEDIA_DEVICE:-/dev/null:/dev/null}
    # VAD bolutleri HOST'a baglaniyor: dogrulamanin tek gercek yolu WAV'lari
    # kulakla dinlemek ve konteyner icinde kalsalardi hem erisilemez hem de
    # her yeniden baslatmada kaybolur olurlardi.
    volumes:
      - ./vad-bolutler:${VAD_SEGMENT_DIR:-/vad-bolutler}
    depends_on:
      - postgres
      - minio
      - redis
    networks:
      - yayin-merkezi

  frontend:
    build:
      context: ./frontend/yayin-frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT_FRONTEND:-3000}:80"
    networks:
      - yayin-merkezi